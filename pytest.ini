[pytest]
testpaths = tests
markers =
    vocareum: live "vocareum test" - calls gpt-4o-mini through the Vocareum OpenAI proxy; skipped unless OPENAI_API_KEY is set
    postgres: live audit-log test against DATABASE_URL (Neon or other Postgres); skipped unless DATABASE_URL is set
filterwarnings =
    ignore::DeprecationWarning
