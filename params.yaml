# Parameters for the DVC pipeline (dvc.yaml), the Prefect flow (ihds/mlops/flow.py) and its local deployment (deploy:).
# Changing a value here makes `dvc repro` re-run only the stages that read it.
prepare:
  test_size: 0.2
  seed: 42
  feast_event_timestamp: "2026-01-01T00:00:00+00:00"  # the Pima data has no timestamps; one fixed date is used

validate:
  range_mostly: 0.99        # share of non-null values that must be inside config.VALID_RANGES
  min_rows: 700
  max_rows: 1000

train:
  C: 1.0
  max_iter: 1000
  class_weight: balanced
  threshold: 0.5
  experiment: ihds-risk-model

evaluate:
  # Deepchecks checks whose failure stops the pipeline (others are reported only).
  # Chosen to catch leakage, label problems and train/test degradation. Known non-critical findings on this
  # data: Simple Model Comparison and Feature Label Correlation Change (Insulin, ~49% missing).
  critical_checks:
    - Data Duplicates
    - Mixed Nulls
    - Conflicting Labels
    - Train Test Samples Mix
    - New Label Train Test
    - Label Drift
    - Feature Drift
    - Prediction Drift
    - Train Test Performance
  min_test_roc_auc: 0.75

explain:
  shap_background: 100
  local_examples: 3
  age_bins: [21, 30, 45, 120]          # right-open bins -> 21-29, 30-44, 45+
  age_labels: ["21-29", "30-44", "45+"]

deploy:
  # Scheduled local Prefect deployment (ihds/mlops/deploy.py, `python -m ihds.mlops.deploy`). Not read by dvc.yaml.
  name: weekly-local
  cron: "0 6 * * 1"                     # Mondays 06:00
  timezone: America/Los_Angeles
  paused: false
  parameters:
    with_feast: true
  tags: [ihds, mlops, local]
  description: "IHDS MLOps pipeline (GX, MLflow, Deepchecks, SHAP/Fairlearn, Evidently, Feast), served locally."
