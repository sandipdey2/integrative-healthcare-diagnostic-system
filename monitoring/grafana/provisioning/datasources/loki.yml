# Loki datasource for docker-compose.monitoring.yml (service name `loki` on the ihds-monitoring network).
# Excluded from Docker build contexts by .dockerignore, so the Azure Option B Grafana image does not get it.
apiVersion: 1
datasources:
  - name: Loki
    uid: ihds-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 500
