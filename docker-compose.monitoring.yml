# Local monitoring stack (optional, NOT part of the Azure deployment):
#   docker compose -f docker-compose.monitoring.yml up -d --build --wait
#   API http://127.0.0.1:8000/docs   metrics http://127.0.0.1:8000/metrics
#   Prometheus http://127.0.0.1:9090  Grafana http://127.0.0.1:3000 (dashboard "IHDS API", anonymous viewer)
#   Loki http://127.0.0.1:3100 (logs; Grafana dashboard "IHDS logs (Loki)", datasource "Loki")
#   docker compose -f docker-compose.monitoring.yml down
# Services share the user-defined bridge network `ihds-monitoring`; Prometheus scrapes the API by service name
# (api:8000). Host ports bind to 127.0.0.1 only. The api service reuses the app image and runs just the FastAPI
# layer on 0.0.0.0:8000 inside the container (tools via an MCP stdio subprocess); no OPENAI_API_KEY is passed,
# so the writer uses the template. A Postgres 17 service holds the assessment audit log (DATABASE_URL on the api
# service; local credentials ihds/ihds, not for production).
# Logs: the API writes JSON lines to a file (IHDS_LOG_FILE). Grafana Alloy tails two places and pushes to Loki:
# the `ihds-logs` volume (the `api` service below) and ./logs on the host (an API started with
# IHDS_LOG_FILE=logs/ihds.jsonl, e.g. `uvicorn api.main:app`). Run `mkdir -p logs` first so Docker does not create
# ./logs as root. Loki keeps 72 h on the ihds-loki-data volume.
# If containers cannot reach each other on a host whose kernel runs BOTH iptables-legacy and nftables rules,
# see scripts/fix_docker_bridge_forward.sh.
name: ihds-monitoring

networks:
  ihds-monitoring:
    driver: bridge

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ihds
      POSTGRES_PASSWORD: ihds
      POSTGRES_DB: ihds
    volumes:
      - ihds-pgdata:/var/lib/postgresql/data
    networks: [ihds-monitoring]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihds -d ihds"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: ihds:local
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      IHDS_METRICS: "1"
      DATABASE_URL: "postgresql://ihds:ihds@postgres:5432/ihds"
      IHDS_LOG_FILE: /app/logs/ihds.jsonl
    volumes:
      - ihds-logs:/app/logs
    networks: [ihds-monitoring]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12

  loki:
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ihds-loki-data:/loki
    networks: [ihds-monitoring]
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      # the image has no shell or wget; -health is Loki's own readiness check (v3.6.5+)
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 6

  alloy:
    image: grafana/alloy:v1.22.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data",
              "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/loki/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/ihds-host:ro
      - ihds-logs:/var/log/ihds-container:ro
      - ihds-alloy-data:/var/lib/alloy/data
    networks: [ihds-monitoring]
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [ihds-monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ihds_api.json
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [ihds-monitoring]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

volumes:
  ihds-pgdata:
  ihds-logs:
  ihds-loki-data:
  ihds-alloy-data:
