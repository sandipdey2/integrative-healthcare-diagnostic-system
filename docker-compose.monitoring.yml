# Local monitoring stack (optional, NOT part of the Azure deployment):
#   docker compose -f docker-compose.monitoring.yml up -d --build
#   API http://127.0.0.1:8000/docs   metrics http://127.0.0.1:8000/metrics
#   Prometheus http://127.0.0.1:9090  Grafana http://127.0.0.1:3000 (dashboard "IHDS API", anonymous viewer)
#   docker compose -f docker-compose.monitoring.yml down
# All ports bind to 127.0.0.1 only. The api service reuses the app image and runs just the FastAPI layer
# (tools via an MCP stdio subprocess); no OPENAI_API_KEY is passed, so the writer uses the template.
services:
  api:
    build: .
    image: ihds:local
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ihds_api.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
