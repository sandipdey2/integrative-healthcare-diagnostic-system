# Local rehearsal of the push path used by options A and B (no cloud needed):
#   docker compose -f deploy/monitoring/docker-compose.push-test.yml up -d --build --wait
# - app:        the real app image running scripts/start_all.sh (MCP + API + Streamlit) with
#               GRAFANA_RW_URL set, so the in-container Prometheus agent pushes ihds_* series out.
#               Port 8000 is published to 127.0.0.1:18000 ONLY so this test can send /assess traffic;
#               in Azure it stays internal.
# - prometheus: the option-B image (deploy/monitoring/prometheus/Dockerfile), remote-write receiver, no scrape
#               of the app. Plays the role of ihds-prometheus (B) or Grafana Cloud's endpoint (A).
# - grafana:    the option-B image (deploy/monitoring/grafana/Dockerfile) pointed at that Prometheus.
# Basic-auth values are dummies (Prometheus ignores them) so the password_file path is exercised too.
#   docker compose -f deploy/monitoring/docker-compose.push-test.yml down
name: ihds-push-test

networks:
  push-test:
    driver: bridge

services:
  app:
    build:
      context: ../..
    image: ihds:local
    environment:
      GRAFANA_RW_URL: http://prometheus:9090/api/v1/write
      GRAFANA_RW_USER: local-test
      GRAFANA_RW_TOKEN: local-test-not-a-secret
      IHDS_METRICS_DEPLOYMENT: local-push-test
    networks: [push-test]
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      prometheus:
        condition: service_healthy

  prometheus:
    build:
      context: ../..
      dockerfile: deploy/monitoring/prometheus/Dockerfile
    image: ihds-prometheus:local
    networks: [push-test]
    ports:
      - "127.0.0.1:19090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    build:
      context: ../..
      dockerfile: deploy/monitoring/grafana/Dockerfile
    image: ihds-grafana:local
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_SECURITY_ADMIN_PASSWORD: local-test-not-a-secret
    networks: [push-test]
    ports:
      - "127.0.0.1:13000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      prometheus:
        condition: service_healthy
