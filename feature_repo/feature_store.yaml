# Local Feast feature store (no cloud services): file offline store over a parquet file, SQLite online store.
# Paths are relative to this directory. Run from here: `feast apply` then `feast materialize-incremental <now>`,
# or `python -m ihds.mlops.features` from the repo root (does both and fetches online features).
project: ihds
provider: local
registry: data/registry.db
online_store:
  type: sqlite
  path: data/online_store.db
offline_store:
  type: file
entity_key_serialization_version: 3
